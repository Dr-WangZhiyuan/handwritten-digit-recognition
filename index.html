<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwritten Digit Recognition — CNN</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0f172a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #e2e8f0;
  padding: 20px;
}

h1 {
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 8px;
  color: #e2e8f0;
  letter-spacing: 0.02em;
}
.subtitle {
  font-size: 0.82rem;
  color: #64748b;
  margin-bottom: 28px;
}

.canvas-wrap {
  position: relative;
  border: 3px solid #2563eb;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  touch-action: none;
}
canvas {
  display: block;
  cursor: crosshair;
}

.controls {
  display: flex;
  gap: 14px;
  margin-top: 24px;
  width: 340px;
}
.btn {
  flex: 1;
  padding: 14px 0;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-clear {
  background: #1e293b;
  color: #94a3b8;
  border: 2px solid #334155;
}
.btn-clear:hover { background: #334155; color: #e2e8f0; }
.btn-read {
  background: #2563eb;
  color: #fff;
}
.btn-read:hover { background: #1d4ed8; }
.btn:disabled { opacity: 0.4; cursor: default; }

.result {
  margin-top: 28px;
  text-align: center;
  min-height: 100px;
}
.result-digit {
  font-size: 5rem;
  font-weight: 700;
  color: #2563eb;
  line-height: 1;
}
.result-conf {
  font-size: 0.85rem;
  color: #64748b;
  margin-top: 6px;
}
.result-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-size: 0.78rem;
}
.result-bar-label {
  width: 16px;
  text-align: right;
  color: #94a3b8;
  font-weight: 600;
}
.result-bar-bg {
  flex: 1;
  height: 8px;
  background: #1e293b;
  border-radius: 4px;
  overflow: hidden;
}
.result-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: #2563eb;
  transition: width 0.3s;
}
.result-bar-pct {
  width: 40px;
  color: #64748b;
}
.result-bars {
  width: 340px;
  margin-top: 16px;
}

.loading {
  color: #64748b;
  font-size: 0.9rem;
}

footer {
  margin-top: 32px;
  color: #334155;
  font-size: 0.72rem;
  text-align: center;
  line-height: 1.6;
}
footer a { color: #2563eb; text-decoration: none; }
footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>Handwritten Digit Recognition</h1>
<div class="subtitle">Draw a digit (0-9) and press READ</div>

<div class="canvas-wrap">
  <canvas id="canvas" width="340" height="340"></canvas>
</div>

<div class="controls">
  <button class="btn btn-clear" id="btn-clear">CLEAR</button>
  <button class="btn btn-read" id="btn-read" disabled>READ</button>
</div>

<div class="result" id="result">
  <div class="loading" id="loading">Loading model...</div>
</div>

<footer>
  CNN model trained on MNIST (99.1% accuracy) &middot; Inference runs locally in browser via ONNX Runtime Web<br>
  Developed by Dr. Wang Zhiyuan &mdash; Singapore University of Social Sciences (SUSS)
</footer>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btnClear = document.getElementById('btn-clear');
const btnRead = document.getElementById('btn-read');
const resultDiv = document.getElementById('result');
const loadingDiv = document.getElementById('loading');

let session = null;
let drawing = false;
let hasDrawn = false;

ctx.fillStyle = '#000';
ctx.fillRect(0, 0, 340, 340);
ctx.strokeStyle = '#fff';
ctx.lineWidth = 18;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';

async function loadModel() {
  try {
    session = await ort.InferenceSession.create('model/mnist_cnn.onnx');
    loadingDiv.textContent = 'Draw a digit above';
    loadingDiv.style.color = '#475569';
    btnRead.disabled = false;
  } catch (e) {
    loadingDiv.textContent = 'Failed to load model: ' + e.message;
    loadingDiv.style.color = '#ef4444';
  }
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches) {
    return {
      x: (e.touches[0].clientX - rect.left) * scaleX,
      y: (e.touches[0].clientY - rect.top) * scaleY
    };
  }
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function startDraw(e) {
  e.preventDefault();
  drawing = true;
  hasDrawn = true;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
}

function stopDraw() {
  drawing = false;
  ctx.beginPath();
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDraw);
canvas.addEventListener('mouseleave', stopDraw);
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', stopDraw);

btnClear.addEventListener('click', () => {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 340, 340);
  hasDrawn = false;
  resultDiv.innerHTML = '<div class="loading" style="color:#475569">Draw a digit above</div>';
});

btnRead.addEventListener('click', async () => {
  if (!session || !hasDrawn) return;

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = 28;
  tempCanvas.height = 28;
  const tempCtx = tempCanvas.getContext('2d');

  tempCtx.fillStyle = '#000';
  tempCtx.fillRect(0, 0, 28, 28);
  tempCtx.drawImage(canvas, 0, 0, 28, 28);

  const imgData = tempCtx.getImageData(0, 0, 28, 28);
  const input = new Float32Array(28 * 28);
  for (let i = 0; i < 28 * 28; i++) {
    input[i] = imgData.data[i * 4] / 255.0;
  }

  const tensor = new ort.Tensor('float32', input, [1, 28, 28, 1]);
  const results = await session.run({ input_layer: tensor });
  const output = results.output_0.data;

  const probs = Array.from(output);
  const maxIdx = probs.indexOf(Math.max(...probs));
  const conf = probs[maxIdx] * 100;

  let html = `<div class="result-digit">${maxIdx}</div>`;
  html += `<div class="result-conf">Confidence: ${conf.toFixed(1)}%</div>`;
  html += '<div class="result-bars">';
  for (let d = 0; d < 10; d++) {
    const pct = probs[d] * 100;
    const color = d === maxIdx ? '#2563eb' : '#334155';
    html += `<div class="result-bar-row">
      <span class="result-bar-label">${d}</span>
      <div class="result-bar-bg"><div class="result-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <span class="result-bar-pct">${pct.toFixed(1)}%</span>
    </div>`;
  }
  html += '</div>';
  resultDiv.innerHTML = html;
});

loadModel();
</script>
</body>
</html>
